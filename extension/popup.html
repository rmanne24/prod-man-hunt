<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMPilot — Associate PM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #0c1410; color: #e5ece8; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1c2b22; padding-bottom: 12px; margin-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #ffffff; }
    .logo-badge { background: #1f3b2d; color: #5eead4; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .project-tag { font-size: 11px; background: #13241b; color: #a7f3d0; padding: 3px 8px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid #204030; }
    .context-card { background: #131d17; border: 1px solid #22352a; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .label { font-size: 11px; color: #86968d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .page-title { font-size: 13px; font-weight: 600; color: #f1f5f3; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-url { font-size: 11px; color: #6e8277; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
    .badge-row { display: flex; gap: 6px; align-items: center; }
    .type-badge { font-size: 10px; background: #224233; color: #6ee7b7; padding: 2px 6px; border-radius: 4px; }
    .trust-badge { font-size: 10px; background: #2e2617; color: #fde68a; padding: 2px 6px; border-radius: 4px; }
    .btn-capture { width: 100%; background: #2d5a43; color: #ffffff; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.2s; }
    .btn-capture:hover { background: #376e52; }
    .btn-workspace { width: 100%; background: transparent; color: #86efac; border: 1px solid #224233; padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 8px; text-align: center; text-decoration: none; display: block; }
    .btn-workspace:hover { background: #162a20; }
    .status-text { font-size: 11px; color: #86968d; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-badge">✦</div>
      <span>Associate PM</span>
    </div>
    <span class="project-tag">AI Checkout</span>
  </div>

  <div class="context-card">
    <div class="label">Detected Active Tab</div>
    <div id="pageTitle" class="page-title">Loading current tab...</div>
    <div id="pageUrl" class="page-url">https://...</div>
    <div class="badge-row">
      <span id="typeBadge" class="type-badge">Web Context</span>
      <span class="trust-badge">Mozilla.ai Cleaned</span>
    </div>
  </div>

  <button id="captureBtn" class="btn-capture">
    <span>+ Capture Tab into Evidence</span>
  </button>

  <a href="http://localhost:5173" target="_blank" class="btn-workspace">
    ↗ Open Full Evidence Workspace
  </a>

  <div id="statusMsg" class="status-text">Ready to sync with PMPilot Redis State</div>

  <script src="popup.js"></script>
</body>
</html>
